<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GitHub Link Viewer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0 16px 0 0;
    color: #58a6ff;
    white-space: nowrap;
  }
  input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #c9d1d9;
    font-size: 14px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #58a6ff;
  }
  button {
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    background: #238636;
    color: white;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #2ea043; }
  #error {
    color: #f85149;
    font-size: 13px;
    padding: 0 20px;
    min-height: 18px;
  }
  #frameWrap {
    flex: 1;
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: white;
  }
  #placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #8b949e;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>🔗 GitHub Viewer</h1>
  <input type="text" id="linkInput" placeholder="GitHub-Link einfügen, z.B. https://github.com/torvalds/linux" />
  <button onclick="loadLink()">Öffnen</button>
</header>

<div id="error"></div>

<div id="frameWrap">
  <div id="placeholder">Gib oben einen GitHub-Link ein und klicke auf "Öffnen".</div>
</div>

<script>
  const input = document.getElementById('linkInput');
  const errorBox = document.getElementById('error');
  const frameWrap = document.getElementById('frameWrap');

  function loadLink() {
    let url = input.value.trim();
    errorBox.textContent = '';

    if (!url) {
      errorBox.textContent = 'Bitte gib einen Link ein.';
      return;
    }

    // Falls kein Protokoll angegeben wurde, https:// ergänzen
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    let parsed;
    try {
      parsed = new URL(url);
    } catch (e) {
      errorBox.textContent = 'Das ist keine gültige URL.';
      return;
    }

    if (!parsed.hostname.endsWith('github.com') && !parsed.hostname.endsWith('githubusercontent.com')) {
      errorBox.textContent = 'Hinweis: Das sieht nicht nach einem GitHub-Link aus, ich versuche es trotzdem.';
    }

    frameWrap.innerHTML = '<iframe src="' + parsed.href.replace(/"/g, '&quot;') + '"></iframe>';
  }

  // Enter-Taste im Eingabefeld erlaubt
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loadLink();
  });
</script>

</body>
</html>
